[project]
name = "pipeline"
version = "0.1.0"
description = "Pipeline that scrapes, parses, normalizes, stores, and exports European annual-report financial statements"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "report-scrape[playwright]",
    "report-discover",
    "pdfplumber>=0.11",
    "lxml>=5.3",
    "openai>=1.40",
    "duckdb>=1.1",
    "pandas>=2.2",
    "typer>=0.12",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "tenacity>=9.0",
    "httpx>=0.27",
    "docling>=2.91.0",
    "pyyaml>=6.0",
]

[project.scripts]
pipeline = "pipeline.interfaces.cli.main:app"

[tool.uv.sources]
report-scrape = { workspace = true }
report-discover = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

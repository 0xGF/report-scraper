[project]
name = "report-scrape"
version = "0.1.0"
description = "Reusable scraper for investor-relations sites: PDF discovery, download, SHA-cached storage, Wayback fallback"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "curl-cffi>=0.7",
    "selectolax>=0.3.24",
    "tenacity>=9.0",
    "structlog>=24.4",
    "pydantic>=2.8",
    "diskcache>=5.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
playwright = ["playwright>=1.55"]
all = ["playwright>=1.55"]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

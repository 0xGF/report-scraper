[project]
name = "report-discover"
version = "0.1.0"
description = "AI-powered discovery of public companies' investor-relations sources — given a name, returns the IR URL, scrape config, and metadata, with an optional verification pass"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "structlog>=24.4",
    "httpx>=0.27",
    "tldextract>=5.1",
]

[project.optional-dependencies]
openai = ["openai>=1.40", "diskcache>=5.6"]
tavily = []   # Tavily uses plain HTTP via httpx; no extra deps needed.
# Enables the IR-page crawler's JS-rendered fallback (Adyen-style React SPAs).
# Without this, the crawler is HTTP-only and works on ~80% of IR sites.
playwright = ["playwright>=1.55"]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
